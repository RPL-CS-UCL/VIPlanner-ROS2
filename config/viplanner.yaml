# VIPlanner ROS2 Configuration
# Adapted from viplanner/ros/planner/config/anymal_mount.yaml

viplanner_node:
  ros__parameters:
    # planning
    main_freq: 5
    image_flip: false
    conv_dist: 0.5
    max_depth: 10.0
    overlap_ratio_thres: 0.7
    depth_zero_ratio_thres: 0.7

    # network model paths (absolute paths inside container)
    model_save: "/home/developer/ros_ws/src/local_planner/viplanner_ros2/models/plannernet"
    m2f_cfg_file: "/home/developer/ros_ws/src/local_planner/viplanner_ros2/models/m2f_model/coco/panoptic/maskformer2_R50_bs16_50ep.yaml"
    m2f_model_path: "/home/developer/ros_ws/src/local_planner/viplanner_ros2/models/m2f_model/coco/panoptic/model_final_94dc52.pkl"

    # ROS topics
    depth_topic: "/rgbd_camera/depth/image"
    depth_info_topic: "/rgbd_camera/depth/camera_info"
    rgb_topic: "/rgbd_camera/color/image_raw/compressed"
    rgb_info_topic: "/rgbd_camera/color/camera_info"
    goal_topic: "/mp_waypoint"
    path_topic: "/viplanner/path"
    m2f_timer_topic: "/viplanner/m2f_timer"
    depth_uint_type: false
    compressed: true
    mount_cam_frame: ""  # set to camera parent frame if cam is mounted externally

    # frame ids
    robot_id: "base_link"
    world_id: "odom"

    # fear reaction
    is_fear_act: true
    buffer_size: 10
    angular_thread: 0.3
    track_dist: 0.5

    # smart joystick
    joyGoal_scale: 0.5
